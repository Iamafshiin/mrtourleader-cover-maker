<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کاورساز مسترتورلیدر</title>
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="کاورساز">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Aref+Ruqaa:wght@700&family=Bebas+Neue&family=Lalezar&family=Montserrat:wght@500;700;800&family=Noto+Color+Emoji&family=Noto+Kufi+Arabic:wght@900&family=Noto+Naskh+Arabic:wght@700&family=Permanent+Marker&family=Playfair+Display:wght@800&family=Rakkas&family=Reem+Kufi:wght@700&family=Vazirmatn:wght@400;500;700;800;900&display=swap">
<style>
:root{--bg:#0B0F14;--panel:#141B24;--line:#26313D;--ink:#F1F3F5;--muted:#9AA4AF;--lapis:#14315C;--turq:#2FA6A0;--saffron:#E8A33D;--emoji:"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji";--font:"Vazirmatn",Tahoma,var(--emoji),sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--font)}
.wrap{max-width:1180px;margin:0 auto;padding-block:max(24px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{margin:0;font:400 clamp(26px,6vw,34px)/1.2 Lalezar,var(--font);color:var(--saffron)}
.lead{margin:0;color:var(--muted);max-width:68ch}
.app{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px}
label{min-width:0;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.hint{font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.6}
input[type=text],textarea,select{width:100%;min-width:0;min-height:44px;font:500 16px/1.5 var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
textarea{resize:vertical;min-height:76px}
input[type=range]{width:100%;min-height:32px;accent-color:var(--saffron)}
input[type=file]{width:100%;min-width:0;font:inherit;font-size:14px;color:var(--muted)}
input[type=file]::file-selector-button{font:700 14px var(--font);border:0;border-radius:8px;padding:10px 14px;margin-inline-end:10px;background:var(--line);color:var(--ink);cursor:pointer}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:500;min-height:32px}
.check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--saffron)}
fieldset{min-width:0;min-inline-size:0;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:12px}
legend{padding:0 6px;color:var(--muted);font-size:13px}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flags button{width:44px;height:44px;padding:0;border-radius:9px;background:var(--bg);border:1px solid var(--line);font:24px/1 var(--emoji),sans-serif;color:var(--ink);cursor:pointer}
.flags button[aria-pressed="true"]{border-color:var(--saffron);box-shadow:0 0 0 2px var(--saffron) inset}
.flags button.clear{width:auto;padding:0 12px;font:700 13px/1 var(--font)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{position:relative;display:block;gap:0}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 8px;font-weight:700;font-size:14px;text-align:center}
.seg input:checked+span{background:var(--saffron);color:#0B0F14}
.seg input:focus-visible+span{outline:3px solid var(--turq);outline-offset:-3px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.swatches input[type=color]{width:52px;height:40px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer}
#fontPreview{font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.btn{font:800 16px/1 var(--font);border:0;border-radius:10px;min-height:50px;padding:0 14px;cursor:pointer;background:var(--saffron);color:#0B0F14}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.stage{min-width:0;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.stage figure{margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.stage figcaption{color:var(--muted);font-size:13px}
.fig-cover{width:360px;max-width:100%}
.fig-tile{width:180px;max-width:100%}
canvas{display:block;width:100%;height:auto;background:var(--lapis)}
#cover{aspect-ratio:9/16;border-radius:14px}
#tile{aspect-ratio:3/4;border-radius:4px}
.status{margin:0;color:var(--muted);font-size:13px;min-height:1.7em}
.mini{display:none;position:fixed;z-index:5;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:76px;padding:0;border:0;border-radius:10px;overflow:hidden;background:var(--lapis);box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 0 2px var(--saffron);cursor:pointer;transition:opacity .2s ease,transform .2s ease}
.mini canvas{width:76px;height:135px;border-radius:0}
.mini span{display:block;font:700 10px/1.8 var(--font);color:#0B0F14;background:var(--saffron);text-align:center}
.mini.is-hidden{opacity:0;transform:translateY(16px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.mini{transition:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px}
  .stage{order:-1;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;align-items:end}
  .fig-cover,.fig-tile{width:auto}
  .stage figcaption{font-size:12px}
  .mini{display:block}
  .panel{padding-bottom:24px}
  .wrap{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  .row{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>کاورساز مسترتورلیدر</h1>
    <p class="lead">عکس را انتخاب کنید، تیتر را بنویسید و PNG آماده‌ی آپلود (۱۰۸۰×۱۹۲۰) را بگیرید. خط‌چین‌ها فقط راهنما هستند و در فایل نهایی نیستند.</p>
  </div>
  <div class="app">
    <form class="panel" id="form" onsubmit="return false">
      <label>عکس کاور
        <input type="file" id="photo" accept="image/*">
        <span class="hint">بهترین نتیجه با عکس عمودی و باکیفیت. صورت یا سوژه را وسط کادر بگذارید.</span>
      </label>
      <label>تیتر
        <textarea id="title" maxlength="60">من میلادم، همسفرت</textarea>
        <span class="hint">حداکثر پنج کلمه. اگر طولانی باشد خودش به خط بعد می‌رود.</span>
      </label>
      <div class="seg" role="radiogroup" aria-label="جهت متن">
        <label><input type="radio" name="dir" value="rtl" checked><span>راست‌به‌چپ · فارسی</span></label>
        <label><input type="radio" name="dir" value="ltr"><span>Left to right · English</span></label>
      </div>
      <label>فونت تیتر
        <select id="font">
          <optgroup label="فارسی">
            <option value="lalezar">لاله‌زار (پیش‌فرض)</option>
            <option value="vazir">وزیرمتن سیاه</option>
            <option value="kufi">نوتو کوفی سیاه</option>
            <option value="reem">ریم کوفی</option>
            <option value="rakkas">رکاس</option>
            <option value="ruqaa">رقعه</option>
            <option value="naskh">نسخ</option>
          </optgroup>
          <optgroup label="English">
            <option value="bebas">Bebas Neue</option>
            <option value="anton">Anton</option>
            <option value="montserrat">Montserrat ExtraBold</option>
            <option value="archivo">Archivo Black</option>
            <option value="playfair">Playfair Display</option>
            <option value="marker">Permanent Marker</option>
          </optgroup>
        </select>
      </label>
      <div class="row">
        <label>نوع محتوا
          <select id="series">
            <option value="travel">سفرنامه</option>
            <option value="sales">فروش و تور بعدی</option>
            <option value="trust">نظر مسافران</option>
            <option value="personal">حرف دل</option>
            <option value="about" selected>درباره‌ی من</option>
          </select>
        </label>
        <label>برچسب سری
          <input type="text" id="label" value="درباره‌ی من">
        </label>
      </div>
      <label>خط دعوت به اقدام
        <input type="text" id="cta" value="" placeholder="مثلاً: کامنت کن «ویتنام»">
        <span class="hint">خالی بگذارید تا نمایش داده نشود.</span>
      </label>
      <fieldset>
        <legend>خط دور باکس تیتر</legend>
        <label class="check"><input type="checkbox" id="border"> نمایش خط دور</label>
        <div class="swatches" id="swatches" role="group" aria-label="رنگ خط دور">
          <button type="button" data-c="#E8A33D" style="background:#E8A33D" aria-label="زعفرانی"></button>
          <button type="button" data-c="#5CC8C2" style="background:#5CC8C2" aria-label="فیروزه‌ای"></button>
          <button type="button" data-c="#FFFFFF" style="background:#FFFFFF" aria-label="سفید"></button>
          <button type="button" data-c="#F3C9D1" style="background:#F3C9D1" aria-label="صورتی"></button>
          <button type="button" data-c="#E5484D" style="background:#E5484D" aria-label="قرمز"></button>
          <button type="button" data-c="#3FB950" style="background:#3FB950" aria-label="سبز"></button>
          <input type="color" id="borderColor" value="#E8A33D" aria-label="رنگ دلخواه">
        </div>
        <span class="hint">یکی از رنگ‌ها را بزنید یا از مربع آخر رنگ دلخواه را انتخاب کنید.</span>
      </fieldset>
      <fieldset>
        <legend>مهر کشور</legend>
        <label class="check"><input type="checkbox" id="stamp" checked> نمایش مهر</label>
        <label>پرچم یا اموجی
          <input type="text" id="emoji" value="✈️" maxlength="8" placeholder="مثلاً 🇻🇳 یا ✈️">
          <span class="hint">یکی از پرچم‌های زیر را بزنید یا هر اموجی را تایپ کنید.</span>
        </label>
        <div class="flags" id="flags" role="group" aria-label="پرچم‌های آماده">
          <button type="button" data-e="🇻🇳" aria-label="ویتنام">🇻🇳</button>
          <button type="button" data-e="🇺🇿" aria-label="ازبکستان">🇺🇿</button>
          <button type="button" data-e="🇮🇷" aria-label="ایران">🇮🇷</button>
          <button type="button" data-e="🇦🇲" aria-label="ارمنستان">🇦🇲</button>
          <button type="button" data-e="🇬🇪" aria-label="گرجستان">🇬🇪</button>
          <button type="button" data-e="🇹🇷" aria-label="ترکیه">🇹🇷</button>
          <button type="button" data-e="🇹🇭" aria-label="تایلند">🇹🇭</button>
          <button type="button" data-e="🇨🇳" aria-label="چین">🇨🇳</button>
          <button type="button" data-e="🇯🇵" aria-label="ژاپن">🇯🇵</button>
          <button type="button" data-e="🇮🇳" aria-label="هند">🇮🇳</button>
          <button type="button" data-e="🇲🇾" aria-label="مالزی">🇲🇾</button>
          <button type="button" data-e="🇦🇪" aria-label="امارات">🇦🇪</button>
          <button type="button" data-e="✈️" aria-label="هواپیما">✈️</button>
          <button type="button" class="clear" data-e="" aria-label="بدون اموجی">بدون اموجی</button>
        </div>
        <div class="row">
          <label>کد<input type="text" id="code" value="" maxlength="4" dir="ltr" placeholder="VN"></label>
          <label>شهر یا تاریخ<input type="text" id="sub" value="" maxlength="10" placeholder="هانوی"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>جای عکس</legend>
        <label>بزرگنمایی<input type="range" id="zoom" min="100" max="250" value="100"></label>
        <label>چپ و راست<input type="range" id="ox" min="-100" max="100" value="0"></label>
        <label>بالا و پایین<input type="range" id="oy" min="-100" max="100" value="0"></label>
      </fieldset>
      <label class="check"><input type="checkbox" id="guides" checked> نمایش خط‌چین کادر گرید</label>
      <div class="actions">
        <button type="button" class="btn" id="download">دانلود PNG</button>
        <button type="button" class="btn ghost" id="reset">پیش‌فرض</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </form>
    <div class="stage">
      <figure class="fig-cover"><canvas id="cover" width="1080" height="1920" aria-label="پیش‌نمایش کاور ۹ در ۱۶"></canvas><figcaption>کاور ریلز ۹:۱۶</figcaption></figure>
      <figure class="fig-tile"><canvas id="tile" width="540" height="720" aria-label="پیش‌نمایش خانه‌ی گرید ۳ در ۴"></canvas><figcaption>در گرید پروفایل (۳:۴)</figcaption></figure>
    </div>
    <button type="button" class="mini is-hidden" id="mini" aria-label="رفتن به پیش‌نمایش بزرگ"><canvas id="miniCanvas" width="152" height="270"></canvas><span>پیش‌نمایش</span></button>
  </div>
</main>
<script>
(function () {
  var W = 1080, H = 1920, SAFE_TOP = 240, SAFE_H = 1440;
  var EMOJI = '"Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji"';
  var C = { lapis: "#14315C", turq: "#5CC8C2", saffron: "#E8A33D", pink: "#F3C9D1", white: "#FFFFFF" };
  var SERIES = {
    travel:   { color: C.turq,    outline: false, label: "سفرنامه ازبکستان" },
    sales:    { color: C.saffron, outline: true,  label: "تور بعدی" },
    trust:    { color: C.saffron, outline: true,  label: "نظر مسافران" },
    personal: { color: C.pink,    outline: false, label: "حرف دل" },
    about:    { color: C.saffron, outline: true,  label: "درباره‌ی من" }
  };
  var FONTS = {
    lalezar:    { family: "Lalezar",           weight: "400", size: 103, dir: "rtl" },
    vazir:      { family: "Vazirmatn",         weight: "900", size: 92,  dir: "rtl" },
    kufi:       { family: "Noto Kufi Arabic",  weight: "900", size: 80,  dir: "rtl" },
    reem:       { family: "Reem Kufi",         weight: "700", size: 98,  dir: "rtl" },
    rakkas:     { family: "Rakkas",            weight: "400", size: 100, dir: "rtl" },
    ruqaa:      { family: "Aref Ruqaa",        weight: "700", size: 96,  dir: "rtl" },
    naskh:      { family: "Noto Naskh Arabic", weight: "700", size: 90,  dir: "rtl" },
    bebas:      { family: "Bebas Neue",        weight: "400", size: 146, dir: "ltr" },
    anton:      { family: "Anton",             weight: "400", size: 112, dir: "ltr" },
    montserrat: { family: "Montserrat",        weight: "800", size: 92,  dir: "ltr" },
    archivo:    { family: "Archivo Black",     weight: "400", size: 90,  dir: "ltr" },
    playfair:   { family: "Playfair Display",  weight: "800", size: 100, dir: "ltr" },
    marker:     { family: "Permanent Marker",  weight: "400", size: 96,  dir: "ltr" }
  };
  var DEFAULT_FONT = { rtl: "lalezar", ltr: "bebas" };
  var $ = function (id) { return document.getElementById(id); };
  function getDir() { var r = document.querySelector('input[name="dir"]:checked'); return r ? r.value : "rtl"; }
  function titleFont() { return FONTS[$("font").value] || FONTS.lalezar; }
  function fontSpec(f) { return f.weight + " " + f.size + "px \"" + f.family + "\""; }
  var cover = $("cover"), ctx = cover.getContext("2d");
  var tile = $("tile"), tctx = tile.getContext("2d");
  var miniCanvas = $("miniCanvas"), mctx = miniCanvas.getContext("2d");
  var img = new Image();

      ctx.font = it.f; ctx.direction = it.dir; ctx.fillStyle = it.emoji ? "#000000" : s.color;
      ctx.fillText(it.t, 0, y + it.lh / 2 + (it.emoji ? 4 : 0));
      y += it.lh;
    });
    ctx.restore();
  }

  function drawGuides() {
    ctx.save(); ctx.setLineDash([24, 18]); ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,.75)";
    ctx.beginPath(); ctx.moveTo(0, SAFE_TOP); ctx.lineTo(W, SAFE_TOP); ctx.moveTo(0, SAFE_TOP + SAFE_H); ctx.lineTo(W, SAFE_TOP + SAFE_H); ctx.stroke();
    ctx.restore();
  }

  function render(withGuides) {
    drawPhoto();
    var plateTop = drawPlate();
    drawStamp(plateTop);
    tctx.clearRect(0, 0, tile.width, tile.height);
    tctx.drawImage(cover, 0, SAFE_TOP, W, SAFE_H, 0, 0, tile.width, tile.height);
    mctx.drawImage(cover, 0, 0, W, H, 0, 0, miniCanvas.width, miniCanvas.height);
    if (withGuides) drawGuides();
  }

  function draw() { render($("guides").checked); }

  function loadEmojiThenDraw() {
    var e = $("emoji").value.trim();
    draw();
    if (!e || !document.fonts || !document.fonts.load) return;
    document.fonts.load('78px "Noto Color Emoji"', e).then(draw, draw);
  }

  function markFlag() {
    var v = $("emoji").value.trim();
    Array.prototype.forEach.call($("flags").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.e === v && v !== ""));
    });
  }

  $("flags").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    $("emoji").value = b.dataset.e;
    if (b.dataset.e) $("stamp").checked = true;
    markFlag(); loadEmojiThenDraw();
  });
  $("emoji").addEventListener("input", function () { markFlag(); loadEmojiThenDraw(); });
  function markSwatch() {
    var v = $("borderColor").value.toLowerCase();
    Array.prototype.forEach.call($("swatches").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.c.toLowerCase() === v));
    });
  }
  function applySeriesBorder() {
    var s = SERIES[$("series").value];
    $("border").checked = s.outline;
    $("borderColor").value = s.outline ? C.saffron : s.color;
    markSwatch();
  }
  function loadFontThenDraw() {
    draw();
    var tf = titleFont();
    var sample = $("title").value || (tf.dir === "rtl" ? "ابپچژگ" : "Abc");
    Promise.all([
      document.fonts.load(fontSpec(tf), sample),
      document.fonts.load((getDir() === "rtl" ? "700 50px Vazirmatn" : "700 50px Montserrat"))
    ]).then(draw, draw);
  }
  function applyDir() {
    var dir = getDir();
    ["title", "label", "cta"].forEach(function (id) { $(id).setAttribute("dir", dir); });
    if (titleFont().dir !== dir) $("font").value = DEFAULT_FONT[dir];
    loadFontThenDraw();
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="dir"]'), function (r) { r.addEventListener("change", applyDir); });
  $("font").addEventListener("change", loadFontThenDraw);
  $("border").addEventListener("change", draw);
  $("borderColor").addEventListener("input", function () { $("border").checked = true; markSwatch(); draw(); });
  $("swatches").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    $("borderColor").value = b.dataset.c; $("border").checked = true; markSwatch(); draw();
  });
  $("series").addEventListener("change", function () { $("label").value = SERIES[$("series").value].label; applySeriesBorder(); draw(); });
  ["label", "cta", "code", "sub", "zoom", "ox", "oy"].forEach(function (id) { $(id).addEventListener("input", draw); });
  $("title").addEventListener("input", loadFontThenDraw);
  ["stamp", "guides"].forEach(function (id) { $(id).addEventListener("change", draw); });

  $("photo").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { hasImg = false; img.src = r.result; $("zoom").value = 100; $("ox").value = 0; $("oy").value = 0; };
    r.readAsDataURL(f);
  });

  $("reset").addEventListener("click", function () {
    $("title").value = "من میلادم، همسفرت"; $("series").value = "about"; $("label").value = SERIES.about.label;
    $("cta").value = ""; $("stamp").checked = true; $("emoji").value = "✈️"; $("code").value = ""; $("sub").value = "";
    $("zoom").value = 100; $("ox").value = 0; $("oy").value = 0;
    document.querySelector('input[name="dir"][value="rtl"]').checked = true; $("font").value = "lalezar";
    applySeriesBorder(); markFlag(); applyDir(); loadEmojiThenDraw();
  });

  function fileName() {
    return "mrtourleader-" + (($("title").value.trim() || "cover").replace(/[\\/:*?"<>|\s]+/g, "-")) + ".png";
  }

  function dataUrlToFile(url, name) {
    var bin = atob(url.split(",")[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: "image/png" });
  }

  $("download").addEventListener("click", function () {
    render(false);
    var name = fileName();
    var url = cover.toDataURL("image/png");
    draw();
    var file = dataUrlToFile(url, name);
    var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(function () {
        $("status").textContent = "آماده شد. در منوی اشتراک «ذخیره در گالری» را بزنید.";
      }, function () { $("status").textContent = ""; });
      return;
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    $("status").textContent = "فایل ذخیره شد: " + name;
  });

  var stageVisible = true, typing = false;
  function updateMini() { $("mini").classList.toggle("is-hidden", stageVisible || typing); }
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      stageVisible = entries[0].isIntersecting; updateMini();
    }, { threshold: 0.25 }).observe(document.querySelector(".fig-cover"));
  }
  $("form").addEventListener("focusin", function (e) {
    if (e.target.matches('input[type="text"], textarea, select')) { typing = true; updateMini(); }
  });
  $("form").addEventListener("focusout", function () { typing = false; setTimeout(updateMini, 150); });
  $("mini").addEventListener("click", function () {
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    document.querySelector(".stage").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  markFlag();
  applySeriesBorder();
  applyDir();
  draw();
  Promise.all([
    document.fonts.load("700 50px Montserrat"),
    document.fonts.load("103px Lalezar"),
    document.fonts.load("700 50px Vazirmatn"),
    document.fonts.load("800 62px Vazirmatn"),
    document.fonts.load('78px "Noto Color Emoji"', "🇺🇿🇻🇳🇮🇷")
  ]).then(draw, draw);
  document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
